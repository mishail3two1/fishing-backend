# Локальная база для разработки: docker compose up -d db
# Логин и пароль берутся из файла .env (скопируй .env.example в .env)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: fishing
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # только localhost: базу не должно быть видно из сети
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d fishing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
